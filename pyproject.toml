[project]
name = "romm-importer"
version = "0.1.0"
description = "Safe, review-first ROM inventory service for RomM"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{name = "RomM Importer maintainers"}]
dependencies = [
  "fastapi>=0.115,<0.116", "uvicorn[standard]>=0.32,<0.33",
  "sqlalchemy>=2.0,<2.1", "pydantic-settings>=2.6,<3",
  "jinja2>=3.1,<4", "python-multipart>=0.0.18,<0.1",
  "argon2-cffi>=23.1,<24", "itsdangerous>=2.2,<3", "httpx>=0.27,<0.29",
]

[project.scripts]
romm-importer = "romm_importer.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1", "mypy>=1.13,<2", "httpx>=0.27,<0.29"]

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "romm_importer", from = "src"}]
[tool.ruff]
line-length = 88
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"] # FastAPI dependency declarations use callable defaults.
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=romm_importer --cov-report=term-missing"
[tool.coverage.report]
fail_under = 80
show_missing = true
[tool.mypy]
python_version = "3.12"
strict = true
