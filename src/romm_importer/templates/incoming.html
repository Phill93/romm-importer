{% extends "base.html" %}{% block content %}<h1>Eingang</h1><p>Quellen werden ausschließlich lesend inventarisiert; Originaldateien werden nie geändert.</p><section class="card"><form method="post" action="/jobs"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Jobname<input name="name" required maxlength="160" placeholder="z. B. Oktober-Import"></label><label>Quelle<select name="source_key">{% for source in sources %}<option value="{{ source.key }}">{{ source.name }}</option>{% endfor %}</select></label><label>DAT-Snapshot<select name="dat_snapshot_id"><option value="">Keine DAT-Analyse (nur Inventur)</option>{% for dat in snapshots %}<option value="{{ dat.id }}">{{ dat.filename }} · {{ dat.source_label }}</option>{% endfor %}</select></label><button>Inventur starten</button></form></section>{% endblock %}
